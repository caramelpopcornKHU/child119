<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>아이119</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- (선택) 파비콘 -->
    <!-- <link rel="icon" href="/favicon.ico" /> -->

    <!-- ✅ 시스템 테마 동기화(필요 없으면 삭제 가능) -->
    <script>
      (function () {
        const defaultThemeMode = "light";
        let themeMode = defaultThemeMode;
        const el = document.documentElement;

        if (el && el.hasAttribute("data-bs-theme-mode")) {
          themeMode = el.getAttribute("data-bs-theme-mode");
        } else if (localStorage.getItem("data-bs-theme") !== null) {
          themeMode = localStorage.getItem("data-bs-theme");
        }
        if (themeMode === "system") {
          themeMode = window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        }
        el.setAttribute("data-bs-theme", themeMode);
      })();
    </script>

    <!-- ✅ Tmap SDK (동기 로드 / async,defer 금지) -->
    <script src="https://apis.openapi.sk.com/tmap/vectorjs?version=1&appKey=pAs3duhDpE5cYgopfzzDmw8anJPaBak8HAdTerg8"></script>

    <!-- ✅ 전역 레이아웃 보정 스타일 -->
    <style>
      /* 기존 style 태그 내부에 추가 */

/* 콘텐츠 중앙 정렬 & 최대 너비 제한 */
#app {
  min-height: 100dvh;
  overflow: auto;
  max-width: 100%; /* 전체 너비 사용 */
  margin: 0 auto; /* 중앙 정렬 */
  width: 100%;
}

/* 데스크톱에서는 모바일 뷰 시뮬레이션 */
@media (min-width: 768px) {
  #app {
    max-width: 480px; /* 모바일 앱처럼 보이게 */
    box-shadow: 0 0 20px rgba(0,0,0,0.1);
  }
  
  body {
    background: #e0e0e0; /* 여백 부분 회색 배경 */
  }
}

/* 콘텐츠 영역 너비 100% 확보 */
.container, .container-fluid {
  width: 100%;
  padding-right: 15px;
  padding-left: 15px;
  margin-right: auto;
  margin-left: auto;
}
      :root{
        /* App.vue 고정 헤더/푸터 실제 높이에 맞춰 조절 */
        --header-h: 60px;
        --footer-h: 64px;
      }

      html, body { height: 100%; }

      /* 본문이 헤더/푸터에 가리지 않도록 전역 패딩 확보 */
      body{
        margin: 0;
        padding-top: calc(var(--header-h) + env(safe-area-inset-top));
        padding-bottom: calc(var(--footer-h) + env(safe-area-inset-bottom));
        /* iOS 구형 안전영역 대비 */
        padding-top: calc(var(--header-h) + constant(safe-area-inset-top));
        padding-bottom: calc(var(--footer-h) + constant(safe-area-inset-bottom));
        overflow: auto;
        background: #f8f9fa;
      }

      /* 앱 컨테이너는 화면 높이 이상 + 스크롤 허용 */
      #app{
        min-height: 100dvh; /* 또는 100svh */
        overflow: auto;
      }
    </style>
  </head>

  <body id="kt_app_body">
    <!-- ✅ Vue mount point -->
    <div id="app" class="d-flex justify-content-center align-items-center"></div>

    <!-- ✅ Vue 진입 파일 (Tmap SDK 아래에 두기) -->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
