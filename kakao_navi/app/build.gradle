plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
}

android {
    namespace 'com.lx.child'
    compileSdk {
        version = release(36)
    }

    defaultConfig {
        applicationId "com.lx.child"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = '11'
    }

    buildFeatures{
        viewBinding = true
    }

}




dependencies {
    implementation libs.androidx.core.ktx
    implementation libs.androidx.appcompat
    implementation libs.material
    implementation libs.androidx.activity
    implementation libs.androidx.constraintlayout
    // 카카오 모빌리티 의존성
    implementation 'com.kakaomobility.knsdk:knsdk_ui:1.9.4'

    // Retrofit (서버 통신 담당)
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    // Gson Converter (JSON을 객체로 자동 변환)
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'

    // Coroutines (비동기 처리)
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2' // lifecycleScope

    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
}