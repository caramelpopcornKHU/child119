spring.application.name=springboot_child

# === Google Cloud SQL ===
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://${PG_HOST:localhost}:${PG_PORT:5432}/${PG_DBNAME:hospital}
spring.datasource.username=${PG_USER:postgres}
spring.datasource.password=${PG_PASS}

firebase.config.path=classpath:serviceAccountKey.json

# === Hibernate ===
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.default_schema=public
spring.jpa.properties.hibernate.dialect=org.hibernate.spatial.dialect.postgis.PostgisPG95Dialect

# === MyBatis ===
mybatis.mapper-locations=classpath:mapper/mapper-*.xml
mybatis.configuration.map-underscore-to-camel-case=true

# === Logging ===
logging.level.org.springframework.web=TRACE
logging.level.org.springframework.beans=DEBUG
logging.level.mapper-addrbook=TRACE

# === Server ===
server.address=0.0.0.0
server.port=${PORT:8080}

# === Gemini API ===
gemini.api.key=${GEMINI_API_KEY}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash-lite:generateContent